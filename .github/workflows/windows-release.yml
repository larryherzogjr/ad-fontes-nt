name: Windows desktop signed release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: windows-signed-release
  cancel-in-progress: false

jobs:
  shared-build:
    name: Verify web and prepare shared offline assets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm --prefix app ci
      - run: npm run verify:both
      - name: Package verified assets
        run: |
          tar -czf desktop-web.tar.gz -C app/desktop/dist .
          sha256sum desktop-web.tar.gz > desktop-web.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-desktop-web-signed-release
          path: |
            desktop-web.tar.gz
            desktop-web.sha256
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Sign and build Windows x64 release candidate
    needs: shared-build
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      AZURE_ARTIFACT_SIGNING_ENDPOINT: https://cus.codesigning.azure.net
      AZURE_ARTIFACT_SIGNING_ACCOUNT: adfontesntsigning
      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: AdFontesNTRelease
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-desktop-web-signed-release
          path: prepared
      - name: Verify and extract shared assets
        shell: pwsh
        run: |
          $expected = (Get-Content prepared/desktop-web.sha256).Split(' ')[0]
          $actual = (Get-FileHash prepared/desktop-web.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Shared asset archive checksum mismatch' }
          New-Item -ItemType Directory -Force app/desktop/dist | Out-Null
          tar -xzf prepared/desktop-web.tar.gz -C app/desktop/dist
          if ($LASTEXITCODE -ne 0) { throw 'Asset extraction failed' }
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare pinned Artifact Signing client tools
        timeout-minutes: 5
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ad-fontes-signing-tools'
          $sdkPackage = Join-Path $root 'Microsoft.Windows.SDK.BuildTools.10.0.28000.2705.nupkg'
          $clientPackage = Join-Path $root 'Microsoft.ArtifactSigning.Client.1.0.128.nupkg'
          New-Item -ItemType Directory -Force $root | Out-Null
          Write-Host 'Downloading pinned Microsoft signing packages.'
          & curl.exe --fail --location --silent --show-error --retry 3 --max-time 120 `
            --output $sdkPackage `
            'https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.buildtools/10.0.28000.2705/microsoft.windows.sdk.buildtools.10.0.28000.2705.nupkg'
          if ($LASTEXITCODE -ne 0) { throw 'Windows SDK Build Tools download failed' }
          & curl.exe --fail --location --silent --show-error --retry 3 --max-time 120 `
            --output $clientPackage `
            'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg'
          if ($LASTEXITCODE -ne 0) { throw 'Artifact Signing client download failed' }
          $sdkHash = (Get-FileHash $sdkPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          $clientHash = (Get-FileHash $clientPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sdkHash -ne '8bfdfb6ca2633f531cf80b5fa22512ba61a394d7988f0970db83baadc67929ed') {
            throw "Windows SDK Build Tools checksum mismatch: $sdkHash"
          }
          if ($clientHash -ne '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b') {
            throw "Artifact Signing client checksum mismatch: $clientHash"
          }
          $sdkRoot = Join-Path $root 'sdk'
          $clientRoot = Join-Path $root 'client'
          New-Item -ItemType Directory -Force -Path $sdkRoot, $clientRoot | Out-Null
          Copy-Item $sdkPackage "$sdkPackage.zip"
          Copy-Item $clientPackage "$clientPackage.zip"
          Expand-Archive -LiteralPath "$sdkPackage.zip" -DestinationPath $sdkRoot
          Expand-Archive -LiteralPath "$clientPackage.zip" -DestinationPath $clientRoot
          $signTool = Join-Path $sdkRoot 'bin\10.0.28000.0\x64\signtool.exe'
          $dlib = Join-Path $clientRoot 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $signTool)) { throw 'Pinned x64 SignTool is missing' }
          if (-not (Test-Path -LiteralPath $dlib)) { throw 'Pinned x64 Artifact Signing dlib is missing' }
          if (-not (dotnet --list-runtimes | Select-String '^Microsoft.NETCore.App 8\.')) {
            throw '.NET 8 runtime required by Artifact Signing is missing'
          }
          "AZURE_ARTIFACT_SIGNING_SIGNTOOL=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AZURE_ARTIFACT_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append
          $signingScript = (Resolve-Path 'app/desktop/src-tauri/windows_artifact_sign.ps1').Path
          $wrapper = Join-Path $env:RUNNER_TEMP 'ad-fontes-artifact-sign.cmd'
          @"
          @"C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$signingScript" %*
          "@ | Set-Content -LiteralPath $wrapper -Encoding ascii
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host 'Pinned Artifact Signing toolchain is ready.'
      - name: Verify Artifact Signing service
        timeout-minutes: 5
        shell: pwsh
        run: |
          $preflight = Join-Path $env:RUNNER_TEMP 'ad-fontes-artifact-signing-preflight.exe'
          Copy-Item "$env:SystemRoot/System32/where.exe" $preflight
          try {
            & app/desktop/src-tauri/windows_artifact_sign.ps1 $preflight
            if ($LASTEXITCODE -ne 0) { throw "Artifact Signing preflight failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $preflight -Force -ErrorAction SilentlyContinue
          }
      - name: Build signed NSIS installer and updater payload
        run: npm run desktop:build -- --bundles nsis --config ci-windows-release.json -- --locked
      - name: Verify and collect signed release candidate
        shell: pwsh
        run: |
          $bundle = 'app/desktop/src-tauri/target/release/bundle'
          $installers = @(Get-ChildItem "$bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $signature = "$($installers[0].FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) { throw 'Windows updater signature is missing' }
          $signTool = $env:AZURE_ARTIFACT_SIGNING_SIGNTOOL
          if (-not (Test-Path -LiteralPath $signTool)) { throw 'Pinned x64 SignTool is unavailable' }
          & $signTool verify /pa /all /v $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer Authenticode verification failed' }
          $app = 'app/desktop/src-tauri/target/release/ad-fontes-nt-desktop.exe'
          & $signTool verify /pa /all /v $app
          if ($LASTEXITCODE -ne 0) { throw 'Application Authenticode verification failed' }
          $output = 'artifacts/desktop/windows'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item $installers[0].FullName $output
          Copy-Item $signature $output
          $files = @(Get-ChildItem $output -File | Sort-Object Name)
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$output/SHA256SUMS.txt" -Encoding utf8
          $config = Get-Content app/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          $om = Get-Content app/lib/domain/om-release.json | ConvertFrom-Json
          @{
            version = $config.version
            platform = 'windows-x86_64'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            omRelease = $om.releaseId
            articleCount = $om.articleCount
            signing = 'Azure Artifact Signing Public Trust; RFC 3161 timestamped'
            publisher = 'Larry Herzog Jr.'
            webview = 'embedded offline Evergreen WebView2 installer'
            installerSha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            updaterArtifact = $installers[0].Name
            updaterSha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            updaterSignatureSha256 = (Get-FileHash $signature -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content "$output/BUILD-INFO.json" -Encoding utf8
          "DESKTOP_VERSION=$($config.version)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ad-Fontes-NT-Windows-x64-signed-${{ env.DESKTOP_VERSION }}
          path: artifacts/desktop/windows/
          retention-days: 30
          if-no-files-found: error
      - name: Report build result
        shell: pwsh
        run: |
          'Windows x64 application and NSIS installer passed Azure Artifact Signing and Authenticode verification. The installer and its separate Tauri updater signature are included for immutable-release assembly. Windows 11 install, upgrade, uninstall and updater acceptance remain required.' >> $env:GITHUB_STEP_SUMMARY
