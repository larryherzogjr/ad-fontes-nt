name: Windows desktop beta

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-beta]
    paths:
      - '.github/workflows/windows-beta.yml'
      - 'app/**'
      - 'scripts/**'
      - 'sources/**'
      - 'content/**'
      - 'tests/**'
      - 'package.json'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-build:
    name: Verify web and prepare shared offline assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm --prefix app ci
      - run: npm run verify:both
      # Preserve the same asset bytes on Windows; never regenerate source releases
      # with platform-dependent text encodings or newline conventions.
      - name: Package verified assets
        run: |
          tar -czf desktop-web.tar.gz -C app/desktop/dist .
          sha256sum desktop-web.tar.gz > desktop-web.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-desktop-web
          path: |
            desktop-web.tar.gz
            desktop-web.sha256
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Build Windows x64 offline installer
    needs: shared-build
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-desktop-web
          path: prepared
      - name: Verify and extract shared assets
        shell: pwsh
        run: |
          $expected = (Get-Content prepared/desktop-web.sha256).Split(' ')[0]
          $actual = (Get-FileHash prepared/desktop-web.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Shared asset archive checksum mismatch' }
          New-Item -ItemType Directory -Force app/desktop/dist | Out-Null
          tar -xzf prepared/desktop-web.tar.gz -C app/desktop/dist
          if ($LASTEXITCODE -ne 0) { throw 'Asset extraction failed' }
      - name: Build NSIS installer
        run: npm run desktop:build -- --bundles nsis --config ci-no-frontend-build.json -- --locked
      - name: Collect tester package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/desktop/windows | Out-Null
          $installers = @(Get-ChildItem app/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          Copy-Item $installers[0].FullName artifacts/desktop/windows/
          Copy-Item docs/Windows-Beta-Testing.md artifacts/desktop/windows/START-HERE.md
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content artifacts/desktop/windows/SHA256SUMS.txt -Encoding utf8
          $om = Get-Content app/lib/domain/om-release.json | ConvertFrom-Json
          @{
            version = '0.1.0'
            platform = 'windows-x86_64'
            commit = '${{ github.sha }}'
            run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            omRelease = $om.releaseId
            articleCount = $om.articleCount
            signing = 'unsigned beta'
            webview = 'embedded offline Evergreen WebView2 installer'
            installerSha256 = $hash
          } | ConvertTo-Json | Set-Content artifacts/desktop/windows/BUILD-INFO.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ad-Fontes-NT-Windows-x64-beta-${{ github.run_number }}
          path: artifacts/desktop/windows/
          retention-days: 30
          if-no-files-found: error
      - name: Report build result
        shell: pwsh
        run: |
          'Windows x64 unsigned beta installer built with offline WebView2 setup. Download the artifact above. Real Windows installation and reading checks remain with the beta testers.' >> $env:GITHUB_STEP_SUMMARY
