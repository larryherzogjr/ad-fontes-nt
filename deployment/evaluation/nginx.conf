# Review and install as a NEW dedicated site after issuing its own certificate.
server {
    listen 80;
    listen [::]:80;
    server_name eval.ad-fontes.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ad-fontes-acme; }
    location / { return 301 https://eval.ad-fontes.app$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eval.ad-fontes.app;
    ssl_certificate /etc/letsencrypt/live/eval.ad-fontes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eval.ad-fontes.app/privkey.pem;
    access_log off;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # No public file alias, CDN cache or fallback for protected content and packages.
    location /api/evaluation/ {
        proxy_pass http://127.0.0.1:8136;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location ^~ /evaluation-content/ { return 404; }
    location ^~ /beta-downloads/ { return 404; }
    location ^~ /desktop-updates/ { return 404; }
    location ^~ /api/account { return 410; }
    location ^~ /api/notes { return 410; }
    location / {
        proxy_pass http://127.0.0.1:8136;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
