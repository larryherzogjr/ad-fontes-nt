limit_req_zone $binary_remote_addr zone=afnt_accounts:10m rate=2r/s;
# Install only after DNS and a certificate for ad-fontes.app are ready.
# Define this log format once in nginx's http context; it omits OAuth query parameters.
# log_format afnt_private '$remote_addr - $request_method $uri $status';
server {
    listen 80;
    listen [::]:80;
    server_name ad-fontes.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ad-fontes-acme;
    }
    location / { return 301 https://ad-fontes.app$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ad-fontes.app;
    ssl_certificate /etc/letsencrypt/live/ad-fontes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad-fontes.app/privkey.pem;
    access_log off; # Avoid logging OAuth codes, passage queries or identities.
    client_max_body_size 10m;
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location ^~ /api/account {
        limit_req zone=afnt_accounts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8135;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8135;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
