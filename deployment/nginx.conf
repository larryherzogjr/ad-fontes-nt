limit_req_zone $binary_remote_addr zone=afnt_accounts:10m rate=2r/s;
# Install only after DNS and a certificate for ad-fontes.app are ready.
# Define this log format once in nginx's http context; it omits OAuth query parameters.
# log_format afnt_private '$remote_addr - $request_method $uri $status';
server {
    listen 80;
    listen [::]:80;
    server_name ad-fontes.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ad-fontes-acme;
    }
    location / { return 301 https://ad-fontes.app$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ad-fontes.app;
    ssl_certificate /etc/letsencrypt/live/ad-fontes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ad-fontes.app/privkey.pem;
    access_log off; # Avoid logging OAuth codes, passage queries or identities.
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    # Unlisted desktop beta packages; never included in site navigation/sitemaps.
    location ^~ /beta-downloads/ {
        alias /var/www/ad-fontes-downloads/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header Content-Disposition attachment always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    # Signed desktop updater metadata. This mutable pointer must never be cached.
    location = /desktop-updates/stable/latest.json {
        alias /var/www/ad-fontes-updates/stable/latest.json;
        default_type application/json;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    # Versioned updater artifacts are immutable. Directory listings stay disabled.
    location ^~ /desktop-updates/releases/ {
        alias /var/www/ad-fontes-updates/releases/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Disposition attachment always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
    location ^~ /desktop-updates/ { return 404; }
    location ^~ /api/account {
        limit_req zone=afnt_accounts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8135;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8135;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
