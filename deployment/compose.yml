name: ad-fontes
services:
  db:
    # Retained only for deliberate legacy-data backup/recovery; unused by the app.
    profiles: [legacy-data]
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: adfontes
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      AFNT_DATABASE_PASSWORD: ${AFNT_DATABASE_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-afnt.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d adfontes']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_ORIGIN: https://ad-fontes.app
    ports: ['127.0.0.1:8135:3000']
    networks: [private, egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  pgdata:
networks:
  private: {internal: true}
  egress:
